<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#1e1e24"/>
  <!-- Window frame / Horizon -->
  <rect x="4" y="4" width="24" height="24" rx="3" fill="#2b2d42"/>
  <!-- Sunset / Daylight glow -->
  <circle cx="16" cy="14" r="7" fill="#f4a261"/>
  <circle cx="16" cy="14" r="5" fill="#e76f51"/>
  <!-- Skyline / Ground -->
  <rect x="4" y="20" width="24" height="8" rx="1" fill="#4a4e69"/>
  <!-- Little protagonist dot figure -->
  <circle cx="16" cy="18" r="2.2" fill="#f8f9fa"/>
  <rect x="14.8" y="20.2" width="2.4" height="4.5" fill="#f8f9fa"/>
  <!-- Window crossbar accent -->
  <line x1="4" y1="16" x2="28" y2="16" stroke="#1e1e24" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="16" y1="4" x2="16" y2="28" stroke="#1e1e24" stroke-width="1" stroke-opacity="0.3"/>
</svg>
